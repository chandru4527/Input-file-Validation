<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <title>Input File Validation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(120deg, #84fab0, #8fd3f4);
            font-family: "Segoe UI";
        }

        .container {
            width: 320px;
            padding: 25px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
        }

        .container h2 {
            text-align: center;
            margin-bottom: 1rem;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #2563eb, #22c55e);
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, .7);
            cursor: pointer;
            transition: 0.3s;
        }

        input:hover {
            background: rgba(255, 255, 255, .9);
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 9px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* message animation */
        #show {
            opacity: 0;
            transform: translateY(-5px);
            transition: 0.3s;
        }

        #show.error,
        #show.valid {
            opacity: 1;
            transform: translateY(0);
            font-size: 14px;
            margin-top: 1rem;
            padding: 0 10px;
        }

        #show.error {
            color: red;
        }

        #show.valid {
            color: green;
        }

        /* footer */
        footer {
            margin-top: 1rem;
            font-size: 12px;
            text-align: center;
            color: #06152e;
        }

        footer i {
            color: red;
            margin: 0 3px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Upload File</h2>

        <div class="file-box">
            <input type="file" id="file" accept=".jpg,.jpeg,.png,.pdf">
        </div>

        <div class="buttons">
            <button type="button" id="rbtn">Remove</button>
        </div>

        <p id="show"></p>
        <footer>
            Made with <i class="ri-heart-fill"></i> using JavaScript
        </footer>

    </div>

    <script>
        const fileInput = document.getElementById("file");
        const show = document.getElementById("show");
        const rbtn = document.getElementById("rbtn");

        const maxSize = 2 * 1024 * 1024;

        // Remove
        rbtn.addEventListener("click", () => {
            fileInput.value = "";
            show.textContent = "";
            show.className = "";
        });

        // Validate
        fileInput.addEventListener("change", () => {

            if (fileInput.files.length === 0) {
                show.className = "show error";
                show.textContent = "No file selected";
                return;
            }

            const file = fileInput.files[0];

            if (file.size > maxSize) {
                show.className = "show error";
                show.innerHTML = `File must be less than 2MB <i class="ri-close-fill"></i>`;
                fileInput.value = "";
                return;
            }

            show.className = "show valid";
            show.innerHTML = `File is valid <i class="ri-check-double-fill"></i>`;
        });
    </script>

</body>


</html>
